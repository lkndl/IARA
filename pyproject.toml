[project]
name = "iara"
dynamic = ["version"]
description = "Interface Analysis and Recognition Architecture - GNN scoring of protein interaction hotspots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.7.3",
    "numpy>=2.0",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.1",
]

[project.scripts]
iara = "iara.predict:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tags, see docs/development.md
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/iara"]
