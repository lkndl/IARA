[project]
name = "iara"
version = "0.1.0"
description = "Interface Analysis and Recognition Architecture - GNN scoring of protein interaction hotspots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "prody>=2.6.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.1",
]

[project.scripts]
iara = "iara.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iara"]
