name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # the version comes from the git tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # the same install dtand uses: no lock file, only the bounds in pyproject.toml
      - name: Install iara as a uv tool
        run: |
          uv tool install --python 3.13 .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Run iara
        run: iara -i tests/fixtures/1brs_AD.cif -o out -j
      - name: Smoke tests
        run: uv run --locked --python 3.13 pytest -v
